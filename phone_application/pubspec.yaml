    sdk: flutter
  loading_animation_widget: 1.3.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  liquid_container: ^1.0.4
  bottom_picker: ^4.1.0
  path_provider: ^2.1.5
  sqflite: ^2.0.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.5
  http: ^1.1.0
  shared_preferences: ^2.0.0
  get: ^4.6.5
  accordion: ^2.6.0
  meta: ^1.11.0
  sizer: ^3.0.6
  colorful_safe_area: ^1.0.0
  dio: ^5.9.1
  dartz: ^0.10.1
  connectivity_plus: ^7.0.0
  fluttertoast: ^9.0.0
  talker: ^5.1.14
  dart_style: ^3.1.2
  form_builder_validators: ^11.3.0
  flutter_form_builder: ^10.1.0
  roundcheckbox: ^2.0.5
