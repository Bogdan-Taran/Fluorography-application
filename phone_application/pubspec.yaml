  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.3
  build_runner:
  custom_lint:
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  freezed: ^3.2.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/circle_favicon.png"

